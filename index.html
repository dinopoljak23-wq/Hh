<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SwipeList">
    <meta name="theme-color" content="#0A0A1A">
    <title>SwipeList</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Shopping List View -->
        <div id="shopping-view" class="view active">
            <div class="header">
                <div class="header-left">
                    <h1>Einkaufsliste</h1>
                    <p id="shopping-count">0 Artikel übrig</p>
                </div>
                <button id="clear-checked-btn" class="clear-btn hidden" onclick="clearChecked()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                    Erledigt löschen
                </button>
            </div>

            <div class="search-bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="shopping-search" placeholder="Suchen..." oninput="renderShopping()">
            </div>

            <div id="shopping-list" class="list-container"></div>

            <button class="fab" onclick="openAddItem()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14m-7-7h14"/></svg>
            </button>
        </div>

        <!-- Notes View -->
        <div id="notes-view" class="view">
            <div class="header">
                <div class="header-left">
                    <h1>Notizen</h1>
                    <p id="notes-count">0 Notizen</p>
                </div>
            </div>

            <div class="search-bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="notes-search" placeholder="Notizen durchsuchen..." oninput="renderNotes()">
            </div>

            <div id="notes-grid" class="notes-grid"></div>

            <button class="fab fab-notes" onclick="openAddNote()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14m-7-7h14"/></svg>
            </button>
        </div>

        <!-- Tab Bar -->
        <nav class="tab-bar">
            <button class="tab active" onclick="switchTab('shopping')" id="tab-shopping">
                <div class="tab-icon-wrap">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.16 6.26l-.86-1.64A1 1 0 005.42 4H2v2h2.84l3.6 7.59-1.35 2.44C6.68 16.69 7.22 18 8.5 18H19v-2H8.1l1.1-2h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0021.1 5H5.21l-.94-1.74z"/></svg>
                    <span id="shopping-badge" class="badge hidden">0</span>
                </div>
                <span>Einkaufsliste</span>
            </button>
            <button class="tab" onclick="switchTab('notes')" id="tab-notes">
                <div class="tab-icon-wrap">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 13h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
                </div>
                <span>Notizen</span>
            </button>
        </nav>
    </div>

    <!-- Add Item Modal -->
    <div id="add-item-modal" class="modal" onclick="closeModal(event, 'add-item-modal')">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Neuer Artikel</h2>
                <button class="modal-close" onclick="closeAddItem()">&times;</button>
            </div>

            <label class="input-label">ARTIKEL</label>
            <input type="text" id="item-name" class="text-input" placeholder="z.B. Milch, Brot, Eier...">

            <label class="input-label">KATEGORIE</label>
            <div id="category-chips" class="chips-row"></div>

            <label class="input-label">MENGE</label>
            <div class="quantity-row">
                <button class="qty-btn" onclick="changeQty(-1)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/></svg>
                </button>
                <span id="qty-value" class="qty-value">1</span>
                <button class="qty-btn qty-plus" onclick="changeQty(1)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14m-7-7h14"/></svg>
                </button>
            </div>

            <button id="add-item-btn" class="primary-btn disabled" onclick="addItem()">Hinzufügen</button>
        </div>
    </div>

    <!-- Add Note Modal -->
    <div id="add-note-modal" class="modal" onclick="closeModal(event, 'add-note-modal')">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="note-modal-title">Neue Notiz</h2>
                <button class="modal-close" onclick="closeAddNote()">&times;</button>
            </div>

            <div id="note-color-picker" class="color-picker-row"></div>

            <input type="text" id="note-title" class="text-input title-input" placeholder="Titel...">

            <textarea id="note-content" class="text-input textarea-input" placeholder="Notiz schreiben..."></textarea>

            <button id="save-note-btn" class="primary-btn disabled" onclick="saveNote()">Speichern</button>
        </div>
    </div>

    <!-- Note Context Menu -->
    <div id="note-menu" class="context-menu hidden">
        <button onclick="pinNote()"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg> <span id="pin-label">Anheften</span></button>
        <button class="delete-opt" onclick="deleteNote()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg> Löschen</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
